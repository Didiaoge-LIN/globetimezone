name: Deploy GlobeTimeZone to Production

on:
  push:
    branches: [main]
  workflow_dispatch:     # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Minify assets
        run: |
          echo "Minifying JS files..."
          for f in js/*.js; do
            base=$(basename "$f" .js)
            node -e "
              const fs = require('fs');
              const code = fs.readFileSync('$f', 'utf8');
              const m = code.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*\$/gm,'').replace(/^\s*\n/gm,'').replace(/\s{2,}/g,' ').trim();
              fs.writeFileSync('js/\${base}.min.js', m);
            "
            echo "  $f → js/${base}.min.js"
          done

      - name: Validate HTML
        run: |
          echo "Checking HTML syntax..."
          find . -name "*.html" -not -path "./node_modules/*" | while read f; do
            if grep -q "</html>" "$f"; then
              echo "  ✓ $f"
            else
              echo "  ❌ $f (missing closing </html>)"
              exit 1
            fi
          done

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git/' --exclude='node_modules/' --exclude='.github/' --exclude='ops/' --exclude='*.md'
          path: ./
          remote_path: /var/www/globetimezone/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - name: Smoke Tests
        run: |
          echo "Running smoke tests..."
          # Wait for Cloudflare cache purge
          sleep 10

          # Test homepage
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://globetimezone.com/)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  ✓ Homepage: 200 OK"
          else
            echo "  ❌ Homepage: $HTTP_CODE"
            exit 1
          fi

          # Test key pages
          for page in "timezone-converter" "world-clock" "meeting-scheduler" "world-map"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://globetimezone.com/pages/$page.html")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  ✓ /pages/$page.html: 200 OK"
            else
              echo "  ⚠ /pages/$page.html: $HTTP_CODE"
            fi
          done

      - name: Notify deployment
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ GlobeTimeZone 部署成功\n• 分支: ${{ github.ref_name }}\n• 提交: ${{ github.sha }}\n• 作者: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ GlobeTimeZone 部署失败\n• 分支: ${{ github.ref_name }}\n• 提交: ${{ github.sha }}\n• 查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
