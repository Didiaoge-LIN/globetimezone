<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Shared Clock | GlobeTimeZone</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles/main.css">
  <!-- 浏览器语言自动检测（同步加载，渲染前跳转） -->
  <script src="/js/auto-lang.js?v=4"></script>
  <script src="/js/i18n.js?v=4" defer data-cfasync="false"></script>
</head>
<body>
  <main id="main-content">
    <h1>🌐 Team Shared Clock</h1>
    <div id="clocks-grid"></div>
    <p>Share this link: <input type="text" id="share-link" readonly></p>
    <p><a href="/pricing">Create your permanent team clock (free)</a></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cities = params.get('cities')?.split(',') || ['UTC'];
    const grid = document.getElementById('clocks-grid')!;
    cities.forEach((city) => {
      const card = document.createElement('div');
      card.className = 'city-card';
      card.innerHTML = `<h3>${city}</h3><real-clock timezone="${city}"><span class="time-display">--:--</span></real-clock>`;
      grid.appendChild(card);
    });
    document.getElementById('share-link')!.setAttribute('value', window.location.href);
  </script>
  <script src="/baidu-analytics.js" defer data-cfasync="false"></script>
</body>
</html>
