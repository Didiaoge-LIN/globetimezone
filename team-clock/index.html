<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Shared Clock | GlobeTimeZone</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles/main.css">
  <!-- 浏览器语言自动检测（同步加载，渲染前跳转） -->
  <script src="/js/auto-lang.js?v=5" data-cfasync="false"></script>
  <script src="/js/i18n.js?v=5" defer data-cfasync="false"></script>

<meta property="og:type" content="website" />
<meta property="og:site_name" content="GlobeTimeZone" />
<meta property="og:title" content="GlobeTimeZone | Right Now Worldwide" />
<meta property="og:description" content="Know what time it is, anywhere. Instantly. No math, no conversions." />
<meta property="og:image" content="https://globetimezone.com/og-default.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="GlobeTimeZone | Right Now Worldwide" />
<meta name="twitter:description" content="Know what time it is, anywhere. Instantly." />
<meta name="twitter:image" content="https://globetimezone.com/og-default.png" />
<link rel="preconnect" href="https://www.googletagmanager.com" />
<link rel="preconnect" href="https://www.google-analytics.com" />
<link rel="preconnect" href="https://js.sentry-cdn.com" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />

<meta name="description" content="GlobeTimeZone — Check the current time anywhere in the world instantly. Compare 200+ cities, schedule global meetings, see who&#x27;s working or sleeping at a glance." />

<link rel="canonical" href="https://globetimezone.com/" />
</head>
<body>
  <main id="main-content">
    <h1>🌐 Team Shared Clock</h1>
    <div id="clocks-grid"></div>
    <p>Share this link: <input type="text" id="share-link" readonly></p>
    <p><a href="/pricing">Create your permanent team clock (free)</a></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cities = params.get('cities')?.split(',') || ['UTC'];
    const grid = document.getElementById('clocks-grid')!;
    cities.forEach((city) => {
      const card = document.createElement('div');
      card.className = 'city-card';
      card.innerHTML = `<h3>${city}</h3><real-clock timezone="${city}"><span class="time-display">--:--</span></real-clock>`;
      grid.appendChild(card);
    });
    document.getElementById('share-link')!.setAttribute('value', window.location.href);
  </script>
  <script src="/baidu-analytics.js" integrity="sha384-0EfHWU8dZqDMg0Tik+MW4oeAn7hbPT9ow36DqdjMKhZkzVDavAaeFXtZaZvq43ZP" crossorigin="anonymous"  defer data-cfasync="false"></script>
</body>
</html>
