    .countdown-hero {
      background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 50%, #8b5cf6 100%);
      color: white;
      padding: 60px 24px;
      text-align: center;

    .countdown-form {
      background: white;
      padding: 28px;
      border-radius: 12px;
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    
    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
    }
    
    .countdown-display {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 32px 0;

    @media (max-width: 640px) {

      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      transition: all 0.3s;
    }
    
    .countdown-unit:hover {

      transform: translateY(-4px);

    }
    
    .countdown-number {

      color: #7c3aed;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    
    .countdown-label {

    .countdown-event {

    .timezone-countdowns {

      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

    .tz-countdown-card {

      border: 1px solid var(--border);

      padding: 24px;
      text-align: center;

    .tz-countdown-card:hover {

    .tz-flag {

      margin-bottom: 12px;
    }
    
    .tz-name {
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .tz-countdown {
      font-size: 2rem;

      color: #7c3aed;

    .presets {

    .preset-btn {
      padding: 8px 16px;
      background: #f5f3ff;
      border: 1px solid #a78bfa;
      border-radius: 100px;
      font-size: 0.85rem;

      color: #7c3aed;

    .preset-btn:hover {

      color: white;
    }
    
    .milestone-alert {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
      text-align: center;
    }
    
    .milestone-alert.approaching {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      border-color: #ef4444;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

<script>
// Time zones to display
const DISPLAY_TIMEZONES = [
  { tz: 'America/New_York', name: '纽约', flag: '🇺🇸' },
  { tz: 'America/Los_Angeles', name: '洛杉矶', flag: '🇺🇸' },
  { tz: 'Europe/London', name: '伦敦', flag: '🇬🇧' },
  { tz: 'Europe/Paris', name: '巴黎', flag: '🇫🇷' },
  { tz: 'Asia/Shanghai', name: '北京', flag: '🇨🇳' },
  { tz: 'Asia/Tokyo', name: '东京', flag: '🇯🇵' },
  { tz: 'Asia/Singapore', name: '新加坡', flag: '🇸🇬' },
  { tz: 'Australia/Sydney', name: '悉尼', flag: '🇦🇺' },
];

let countdownInterval = null;
let targetDate = null;
let eventName = '';

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  // Set default date to tomorrow
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('event-date').value = tomorrow.toISOString().split('T')[0];
  
  loadSavedCountdowns();
});

function setPreset(type) {
  const now = new Date();
  const input = document.getElementById('event-date');
  const timeInput = document.getElementById('event-time');
  const nameInput = document.getElementById('event-name');
  
  switch(type) {
    case 'newyear':
      const newYear = new Date(now.getFullYear() + 1, 0, 1);
      input.value = newYear.toISOString().split('T')[0];
      timeInput.value = '00:00';
      nameInput.value = '🎆 元旦';
      break;
    case 'christmas':
      let christmas = new Date(now.getFullYear(), 11, 25);
      if (christmas < now) christmas.setFullYear(christmas.getFullYear() + 1);
      input.value = christmas.toISOString().split('T')[0];
      timeInput.value = '00:00';
      nameInput.value = '🎄 圣诞节';
      break;
    case 'weekend':
      const daysUntilSaturday = (6 - now.getDay() + 7) % 7 || 7;
      const saturday = new Date(now);
      saturday.setDate(saturday.getDate() + daysUntilSaturday);
      input.value = saturday.toISOString().split('T')[0];
      timeInput.value = '09:00';
      nameInput.value = '📅 团队例会';
      break;
    case 'month':
      const monthLater = new Date(now);
      monthLater.setMonth(monthLater.getMonth() + 1);
      input.value = monthLater.toISOString().split('T')[0];
      timeInput.value = '12:00';
      nameInput.value = '📆 月度回顾';
      break;
    case 'quarter':
      const quarter = Math.floor(now.getMonth() / 3) + 1;
      const quarterEndMonth = quarter * 3;
      let quarterEnd = new Date(now.getFullYear(), quarterEndMonth, 1);
      if (quarterEnd <= now) quarterEnd.setFullYear(quarterEnd.getFullYear() + 1);
      input.value = quarterEnd.toISOString().split('T')[0];
      timeInput.value = '17:00';
      nameInput.value = '📊 季度末';
      break;
  }
}

function createCountdown() {
  const name = document.getElementById('event-name').value.trim() || '活动';
  const dateVal = document.getElementById('event-date').value;
  const timeVal = document.getElementById('event-time').value;
  const tz = document.getElementById('event-tz').value;
  
  if (!dateVal) {
    alert('请选择活动日期');
    return;
  }
  
  // Create target date
  const [year, month, day] = dateVal.split('-').map(Number);
  const [hour, minute] = timeVal.split(':').map(Number);
  targetDate = new Date(year, month - 1, day, hour, minute, 0);
  
  // If timezone is not UTC, adjust
  const tzOffset = getTimezoneOffset(tz);
  targetDate = new Date(targetDate.getTime() - tzOffset * 60 * 60 * 1000);
  
  eventName = name;
  
  // Update display
  document.getElementById('display-event-name').textContent = name;
  const localDate = new Date(targetDate.getTime() + tzOffset * 60 * 60 * 1000);
  document.getElementById('display-datetime').textContent = 
    localDate.toLocaleDateString('zh-CN', { 
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit', timeZone: tz
    });
  
  // Generate timezone cards
  renderTimezoneCards();
  
  // Show countdown
  document.getElementById('countdown-display').style.display = 'block';
  
  // Start countdown
  if (countdownInterval) clearInterval(countdownInterval);
  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 1000);
  
  // Save countdown
  saveCountdown({ name, dateVal, timeVal, tz });
  
  // Scroll to countdown
  document.getElementById('countdown-display').scrollIntoView({ behavior: 'smooth' });
}

function updateCountdown() {
  if (!targetDate) return;
  
  const now = new Date();
  const diff = targetDate - now;
  
  if (diff <= 0) {
    // Event has passed
    document.getElementById('days').textContent = '00';
    document.getElementById('hours').textContent = '00';
    document.getElementById('minutes').textContent = '00';
    document.getElementById('seconds').textContent = '00';
    
    const alert = document.getElementById('milestone-alert');
    alert.style.display = 'block';
    alert.classList.add('approaching');
    document.getElementById('milestone-message').textContent = '🎉 活动时间已到！';
    return;
  }
  
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
  
  document.getElementById('days').textContent = String(days).padStart(2, '0');
  document.getElementById('hours').textContent = String(hours).padStart(2, '0');
  document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
  document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  
  // Check milestones
  checkMilestones(days, hours, minutes);
}

function checkMilestones(days, hours, minutes) {
  const alert = document.getElementById('milestone-alert');
  const message = document.getElementById('milestone-message');
  
  alert.style.display = 'none';
  alert.classList.remove('approaching');
  
  if (days === 0 && hours === 0 && minutes <= 5) {
    alert.style.display = 'block';
    alert.classList.add('approaching');
    message.textContent = '🔥 不到5分钟了！';
  } else if (days === 0 && hours === 0) {
    alert.style.display = 'block';
    message.textContent = '⏰ 不到1小时了！';
  } else if (days === 0) {
    alert.style.display = 'block';
    message.textContent = '⏱️ 不到24小时了！';
  } else if (days === 7) {
    alert.style.display = 'block';
    message.textContent = '📅 还有1周！';
  } else if (days === 30) {
    alert.style.display = 'block';
    message.textContent = '🗓️ 还有1个月！';
  }
}

function renderTimezoneCards() {
  const container = document.getElementById('timezone-countdowns');
  const tz = document.getElementById('event-tz').value;
  
  container.innerHTML = DISPLAY_TIMEZONES.map(item => {
    const localTarget = new Date(targetDate.getTime() + getTimezoneOffset(item.tz) * 60 * 60 * 1000);
    const timeStr = localTarget.toLocaleTimeString('zh-CN', { 
      hour: '2-digit', minute: '2-digit', hour12: false 
    });
    const dateStr = localTarget.toLocaleDateString('zh-CN', { 
      month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
    });
    
    return `
      <div class="tz-countdown-card">
        <div class="tz-flag">${item.flag}</div>
        <div class="tz-name">${item.name}</div>
        <div class="tz-time">${dateStr}</div>
      </div>
    `;
  }).join('');
}

function getTimezoneOffset(tz) {
  const now = new Date();
  const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
  const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
  return (tzDate - utcDate) / 3600000;
}

function shareCountdown() {
  const text = "⏱️ \u300A" + eventName + "\u300B\u5012\u8ba1\u65f6\uff1a\n\n" + window.location.href;
  navigator.clipboard.writeText(text).then(() => {
    alert('倒计时链接已复制到剪贴板！');
  });
}

function copyCountdownLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    alert('链接已复制！');
  });
}

function resetCountdown() {
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
  targetDate = null;
  document.getElementById('countdown-display').style.display = 'none';
  document.getElementById('event-name').value = '';
  document.getElementById('milestone-alert').style.display = 'none';
}

// Local storage
function saveCountdown(data) {
  let saved = JSON.parse(localStorage.getItem('gtz_countdowns') || '[]');
  saved.unshift({ ...data, id: Date.now() });
  saved = saved.slice(0, 10); // Keep last 10
  localStorage.setItem('gtz_countdowns', JSON.stringify(saved));
  loadSavedCountdowns();
}

function loadSavedCountdowns() {
  const saved = JSON.parse(localStorage.getItem('gtz_countdowns') || '[]');
  const container = document.getElementById('saved-countdowns');
  
  if (saved.length === 0) {
    container.innerHTML = '<p style="color:#595959;text-align:center;padding:20px;">暂无保存的倒计时。</p>';
    return;
  }
  
  container.innerHTML = saved.map(item => {
    const date = new Date(item.dateVal);
    return `
      <div class="card" style="padding:16px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong>${item.name}</strong>
            <div style="font-size:0.85rem;color:#595959;">${date.toLocaleDateString('zh-CN')}</div>
          </div>
          <div>
            <button class="btn btn-outline btn-sm" onclick="loadCountdown('${item.dateVal}', '${item.timeVal}', '${item.name}', '${item.tz}')">加载</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function loadCountdown(dateVal, timeVal, name, tz) {
  document.getElementById('event-name').value = name;
  document.getElementById('event-date').value = dateVal;
  document.getElementById('event-time').value = timeVal;
  document.getElementById('event-tz').value = tz;
  createCountdown();
}
</script>
