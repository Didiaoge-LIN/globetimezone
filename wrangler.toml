name = "globetimezone"
type = "static"
compatibility_date = "2026-06-01"

# 静态网站构建配置（Cloudflare Pages）
# 通过 GitHub 连接时，Pages 会自动读取此文件

[build]
command = "npm install && npm run build"
publish = "."

# 不需要构建命令（纯静态），取消上面注释改为：
# command = ""
# publish = "."

# 环境变量（如需要）
#[vars]
# API_BASE_URL = "https://globetimezone.com"
