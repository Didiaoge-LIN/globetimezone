name = "globetimezone"
compatibility_date = "2026-06-01"

# Cloudflare Pages 构建配置
# 纯静态 + Pages Functions 混合模式

[build]
command = ""
publish = "."

# KV Namespace 绑定
# AD_KV: 广告解锁权益体系专用（速率限制+日限持久化）
# ⚠️ 需先在CF Dashboard创建KV namespace: wrangler kv:namespace create AD_KV
# 创建后填入下方的 id（CF Dashboard → Workers & Pages → KV 查看namespace ID）
[[kv_namespaces]]
binding = "AD_KV"
id = "PLACEHOLDER_REPLACE_WITH_KV_NAMESPACE_ID"

# 环境变量（如需要）
#[vars]
# API_BASE_URL = "https://globetimezone.com"
