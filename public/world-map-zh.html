  <style>
    .map-container {
      background: #1a365d;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }
    
    .world-map {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    @media (max-width: 768px) {
      .world-map {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    
    @media (max-width: 480px) {
      .world-map {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    
    .region-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
    }
    
    .region-card:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }
    
    .region-card.selected {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(37,99,235,0.5);
    }
    
    .region-flag {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    
    .region-name {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    
    .region-time {
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    
    .region-offset {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 4px;
    }
    
    .time-comparison-panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
    }
    
    .comparison-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .current-time-display {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }
    
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    
    .timezone-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .timezone-table th, .timezone-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    
    .timezone-table th {
      background: var(--bg);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    
    .timezone-table tr:hover td {
      background: var(--primary-light);
    }
    
    .timezone-table .time-cell {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    
    .timezone-table .diff-cell {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    
    .timezone-table .diff-cell.positive {
      color: #10b981;
    }
    
    .timezone-table .diff-cell.negative {
      color: #ef4444;
    }
    
    .timezone-table .status-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .status-dot.working { background: #10b981; }
    .status-dot.off { background: #6b7280; }
    .status-dot.night { background: #3b82f6; }
    
    .utc-indicator {
      background: var(--bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .sun-timeline {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    
    .sun-segment {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
    }
    
    .sun-segment.night { background: #1e3a5f; }
    .sun-segment.sunrise { background: #fed7aa; }
    .sun-segment.day { background: #fbbf24; }
    .sun-segment.sunset { background: #fecaca; }
  </style>

  <p style="color:#595959;text-align:center;margin-bottom:32px;">点击区域查看实时时钟，对比全球各地时间</p>
  
  <!-- World Map -->

<script>
// Regions data
const REGIONS = [
  { id: 'us-pacific', name: '美国太平洋', flag: '🌊', tz: 'America/Los_Angeles', cities: '洛杉矶、旧金山、西雅图' },
  { id: 'us-mountain', name: '美国山区', flag: '🏔️', tz: 'America/Denver', cities: '丹佛、凤凰城' },
  { id: 'us-central', name: '美国中部', flag: '🌽', tz: 'America/Chicago', cities: '芝加哥、休斯顿、达拉斯' },
  { id: 'us-eastern', name: '美国东部', flag: '🗽', tz: 'America/New_York', cities: '纽约、迈阿密、波士顿' },
  { id: 'brazil', name: '巴西', flag: '🇧🇷', tz: 'America/Sao_Paulo', cities: '圣保罗、里约热内卢' },
  { id: 'uk', name: '英国', flag: '🇬🇧', tz: 'Europe/London', cities: '伦敦、都柏林、爱丁堡' },
  { id: 'western-eu', name: '西欧', flag: '🇪🇺', tz: 'Europe/Paris', cities: '巴黎、柏林、罗马、马德里' },
  { id: 'eastern-eu', name: '东欧', flag: '🇷🇺', tz: 'Europe/Moscow', cities: '莫斯科、伊斯坦布尔' },
  { id: 'india', name: '印度', flag: '🇮🇳', tz: 'Asia/Kolkata', cities: '孟买、新德里、班加罗尔' },
  { id: 'china', name: '中国', flag: '🇨🇳', tz: 'Asia/Shanghai', cities: '北京、上海、香港' },
  { id: 'se-asia', name: '东南亚', flag: '🌴', tz: 'Asia/Bangkok', cities: '曼谷、雅加达、新加坡' },
  { id: 'japan-kr', name: '日本及韩国', flag: '🇯🇵', tz: 'Asia/Tokyo', cities: '东京、首尔、大阪' },
  { id: 'aus-eastern', name: '澳大利亚东部', flag: '🦘', tz: 'Australia/Sydney', cities: '悉尼、墨尔本、布里斯班' },
  { id: 'nz', name: '新西兰', flag: '🇳🇿', tz: 'Pacific/Auckland', cities: '奥克兰、惠灵顿' },
  { id: 'mideast', name: '中东', flag: '🏜️', tz: 'Asia/Dubai', cities: '迪拜、阿布扎比' },
  { id: 'hawaii', name: '夏威夷', flag: '🏝️', tz: 'Pacific/Honolulu', cities: '火奴鲁鲁' },
  { id: 'alaska', name: '阿拉斯加', flag: '❄️', tz: 'America/Anchorage', cities: '安克雷奇' },
  { id: 'canada-atl', name: '加拿大大西洋', flag: '🍁', tz: 'America/Halifax', cities: '多伦多、蒙特利尔、温哥华' },
];

// All cities for comparison
const CITIES = [
  { name: '洛杉矶', tz: 'America/Los_Angeles', flag: '🇺🇸', region: '美洲' },
  { name: '纽约', tz: 'America/New_York', flag: '🇺🇸', region: '美洲' },
  { name: '伦敦', tz: 'Europe/London', flag: '🇬🇧', region: '欧洲' },
  { name: '巴黎', tz: 'Europe/Paris', flag: '🇫🇷', region: '欧洲' },
  { name: '柏林', tz: 'Europe/Berlin', flag: '🇩🇪', region: '欧洲' },
  { name: '迪拜', tz: 'Asia/Dubai', flag: '🇦🇪', region: '亚洲' },
  { name: '孟买', tz: 'Asia/Kolkata', flag: '🇮🇳', region: '亚洲' },
  { name: '北京', tz: 'Asia/Shanghai', flag: '🇨🇳', region: '亚洲' },
  { name: '新加坡', tz: 'Asia/Singapore', flag: '🇸🇬', region: '亚洲' },
  { name: '东京', tz: 'Asia/Tokyo', flag: '🇯🇵', region: '亚洲' },
  { name: '悉尼', tz: 'Australia/Sydney', flag: '🇦🇺', region: '太平洋' },
  { name: '圣保罗', tz: 'America/Sao_Paulo', flag: '🇧🇷', region: '美洲' },
];

let selectedRegion = null;

function initMap() {
  const container = document.getElementById('world-map');
  
  container.innerHTML = REGIONS.map(region => `
    <div class="region-card" id="region-${region.id}" onclick="selectRegion('${region.id}')">
      <div class="region-flag">${region.flag}</div>
      <div class="region-name">${region.name}</div>
      <div class="region-time" id="time-${region.id}">--:--</div>
      <div class="region-offset" id="offset-${region.id}">UTC</div>
    </div>
  `).join('');
}

function selectRegion(id) {
  selectedRegion = id;
  
  // Update UI
  document.querySelectorAll('.region-card').forEach(card => card.classList.remove('selected'));
  document.getElementById(`region-${id}`).classList.add('selected');
  
  // Scroll to comparison table
  document.querySelector('.time-comparison-panel').scrollIntoView({ behavior: 'smooth' });
}

function updateTimes() {
  const now = new Date();
  
  // Update local time
  document.getElementById('local-time').textContent = now.toLocaleTimeString('zh-CN', { 
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
  });
  
  // Update UTC time
  const utcTime = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'UTC',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  }).format(now);
  document.getElementById('utc-time').textContent = utcTime;
  
  // Update sun timeline
  updateSunTimeline();
  
  // Update region cards
  REGIONS.forEach(region => {
    const timeEl = document.getElementById(`time-${region.id}`);
    const offsetEl = document.getElementById(`offset-${region.id}`);
    
    if (timeEl) {
      const timeStr = new Intl.DateTimeFormat('zh-CN', {
        timeZone: region.tz,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(now);
      timeEl.textContent = timeStr;
    }
    
    if (offsetEl) {
      const offset = getOffset(region.tz);
      offsetEl.textContent = offset;
    }
  });
  
  // Update comparison table
  updateComparisonTable();
}

function updateSunTimeline() {
  const now = new Date();
  const utcHour = now.getUTCHours();
  const timeline = document.getElementById('sun-timeline');
  
  let segments = [];
  for (let i = 0; i < 24; i++) {
    let className = 'sun-segment';
    if (i < 6 || i >= 19) {
      className += ' night';
    } else if (i >= 6 && i < 8) {
      className += ' sunrise';
    } else if (i >= 8 && i < 17) {
      className += ' day';
    } else {
      className += ' sunset';
    }
    
    if (i === utcHour) {
      className += ' active';
    }
    
    segments.push(`<div class="${className}" title="${i}:00 UTC"></div>`);
  }
  
  timeline.innerHTML = segments.join('');
}

function updateComparisonTable() {
  const now = new Date();
  const tbody = document.getElementById('timezone-tbody');
  
  tbody.innerHTML = CITIES.map(city => {
    const timeStr = new Intl.DateTimeFormat('zh-CN', {
      timeZone: city.tz,
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).format(now);
    
    const hour = parseInt(timeStr.split(':')[0]);
    const isWorking = hour >= 9 && hour < 18;
    const isNight = hour < 6 || hour >= 21;
    
    // Calculate difference from local time
    const localHour = now.getHours();
    const diff = hour - localHour;
    
    let diffText = '';
    let diffClass = '';
    
    if (diff > 0) {
      diffText = `+${diff}小时`;
      diffClass = 'positive';
    } else if (diff < 0) {
      diffText = `${diff}小时`;
      diffClass = 'negative';
    } else {
      diffText = '相同';
      diffClass = '';
    }
    
    let statusText = isWorking ? '工作时间内' : (isNight ? '深夜' : '已下班');
    let statusClass = isWorking ? 'working' : (isNight ? 'night' : 'off');
    
    return `
      <tr>
        <td>${city.flag} ${city.region}</td>
        <td><strong>${city.name}</strong></td>
        <td class="time-cell">${timeStr}</td>
        <td class="diff-cell ${diffClass}">${diffText}</td>
        <td class="status-cell">
          <span class="status-dot ${statusClass}"></span>
          ${statusText}
        </td>
      </tr>
    `;
  }).join('');
}

function getOffset(tz) {
  const now = new Date();
  const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
  const tzDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
  const diff = (tzDate - utcDate) / 3600000;
  const sign = diff >= 0 ? '+' : '-';
  const absDiff = Math.abs(diff);
  const h = Math.floor(absDiff);
  const m = Math.round((absDiff - h) * 60);
  return `UTC${sign}${h}${m ? ':'+String(m).padStart(2,'0') : ''}`;
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  updateTimes();
  setInterval(updateTimes, 1000);
});
</script>
