<!DOCTYPE html>

  <style nonce="{{nonce}}">
    real-clock, smart-clock {
      display: inline-block;
      min-width: 60px;
      visibility: hidden;
    }
    real-clock:defined, smart-clock:defined {
      visibility: visible;
    }

      height: 250px;
      background: #f8fafc;
      contain: layout style;
    }
    .skip-link {
      position: absolute;
      top: -100px;

    }
    :root {
      --bg: #ffffff;
      --bg-card: #f8fafc;
      --text: #1a1a2e;
      --text-secondary: #64748b;
      --accent: #0066cc;
      --border: #e2e8f0;

    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.6;
    }
    .city-status-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .city-status-card {
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .city-status-card:hover {
      box-shadow: 0 8px 24px -4px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .remove-btn:hover { color: #ef4444 !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .city-status-card { animation: fadeIn 0.35s ease-out; }
    #meeting-toggle:hover { background: var(--accent) !important; color: #fff !important; }
      background: var(--accent);
      color: #fff !important;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>

<body>
  <a href="#main-content" class="skip-link">跳到主内容</a>

      <a href="/time-difference/" style="text-decoration:none;color:var(--text);">时差查询</a>
      <a href="/meeting-planner/" style="text-decoration:none;color:var(--text);">会议规划</a>
      <a href="/tools/cross-border/" style="text-decoration:none;color:var(--text);">跨境工具</a>
      <a href="/blog/" style="text-decoration:none;color:var(--text);">教程</a>
      <a href="/pricing/" class="pro-link">升级PRO</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero" style="text-align:center;padding:3rem 1rem;max-width:900px;margin:0 auto;">
      <p style="font-size:0.85rem;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;margin-bottom:0.5rem;">全球此刻</p>
      <h1 style="font-size:2.8rem;margin-bottom:0.5rem;font-weight:700;">🌍 他们在干嘛，一眼就知道</h1>
      <p style="color:var(--text-secondary);font-size:1.1rem;margin-bottom:2rem;max-width:600px;margin-left:auto;margin-right:auto;">
        旧金山在睡、伦敦在上班、东京在下班路上的黄昏。<br>不查时区，直接感知全球节奏。
      </p>
      
      <div class="smart-search" style="max-width:600px;margin:0 auto 2rem;position:relative;">
        <input type="text" id="decision-input" 
               placeholder="例如：给纽约打电话、规划东京+伦敦会议、旧金山现在几点？"
               autocomplete="off"
               style="width:100%;padding:1rem 1.5rem;font-size:1.1rem;border:2px solid #e2e8f0;border-radius:12px;outline:none;">
      </div>

      <!-- 地球昼夜可视化 -->
      <div id="earth-visual" style="margin:1.5rem auto 0;max-width:600px;"></div>

      <!-- 自定义城市搜索 -->
      <div style="max-width:600px;margin:1.5rem auto 0;position:relative;">
        <input type="text" id="city-search-input" placeholder="添加城市…（例如：Paris、Dubai、Sydney）" autocomplete="off" style="width:100%;padding:0.7rem 1rem;font-size:0.95rem;border:1.5px solid #e2e8f0;border-radius:10px;outline:none;box-sizing:border-box;">
        <div id="city-search-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.08);z-index:100;max-height:220px;overflow-y:auto;"></div>
      </div>

      <!-- 动态城市卡片容器 -->
      <div id="custom-city-cards" class="quick-cards" style="display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-top:1.2rem;"></div>
    </section>
  </main>

  <script>
    (function() {
      var tzData = {
        'America/New_York':    { name: '纽约', hint: '美东时间' },
        'Europe/London':       { name: '伦敦', hint: '格林威治' },
        'Asia/Tokyo':          { name: '东京', hint: '日本时间' },
        'Asia/Shanghai':       { name: '北京', hint: '中国时间' }
      };

      function getHour(tz) {
        try {
          var now = new Date();
          var parts = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            hour: 'numeric',
            hour12: false
          }).formatToParts(now);
          var hourPart = parts.find(p => p.type === 'hour');
          return hourPart ? parseInt(hourPart.value, 10) : new Date().getUTCHours();
        } catch(e) { return new Date().getUTCHours(); }
      }

      function updateStatusBadges() {
        document.querySelectorAll('.city-status-card').forEach(card => {
          var tz = card.getAttribute('data-tz');
          if (!tz) return;
          var badge = card.querySelector('.status-badge');
          if (!badge) return;
          var hour = getHour(tz);
          var nextWork = '';
          if (hour < 7) nextWork = ' 明天 07:00 可联系';
          else if (hour >= 22) nextWork = ' 明天 10:00 可联系';

          if (hour >= 9 && hour < 18) {
            badge.textContent = '🟢 工作中 · 可联系';
            badge.style.background = '#d1fae5';
            badge.style.color = '#065f46';
          } else if (hour >= 7 && hour < 22) {
            badge.textContent = '🟡 非工作时段';
            badge.style.background = '#fef3c7';
            badge.style.color = '#92400e';
          } else {
            badge.textContent = '🔴 深夜勿扰' + nextWork;
            badge.style.background = '#fee2e2';
            badge.style.color = '#991b1b';
          }
        });
      }

      // 等 DOM + 时区数据就绪
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateStatusBadges);
      } else {
        updateStatusBadges();
      }
      setInterval(updateStatusBadges, 60000);
    })();
  </script>

  <aside class="sidebar-ad" aria-label="广告">
