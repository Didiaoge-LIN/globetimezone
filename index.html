<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTimeZone — 全球时间决策工具</title>
  <meta name="description" content="一眼判断该不该联系、何时开会。实时感知全球节奏。">
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://pagead2.googlesyndication.com">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles/premium.css?v=1">
  <style nonce="{{nonce}}">
    real-clock, smart-clock {
      display: inline-block; min-width: 60px; visibility: hidden;
    }
    real-clock:defined, smart-clock:defined { visibility: visible; }
    .ad-container { width: 300px; height: 250px; background: #f8fafc; contain: layout style; }
    .skip-link { position: absolute; top: -100px; left: 0; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主内容</a>
  
  <header id="site-header">
    <nav aria-label="主导航" style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;max-width:1200px;margin:0 auto;padding:0.75rem 1.5rem;">
      <a href="/" style="font-weight:800;font-size:1.05rem;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:0.4rem;">
        <span style="font-size:1.3rem;">🌍</span>GlobeTimeZone
      </a>
      <a href="/time-difference/" style="text-decoration:none;color:var(--text);">时差查询</a>
      <a href="/meeting-planner/" style="text-decoration:none;color:var(--text);">会议规划</a>
      <a href="/tools/cross-border/" style="text-decoration:none;color:var(--text);">跨境工具</a>
      <a href="/blog/" style="text-decoration:none;color:var(--text);">教程</a>
      <a href="/pricing/" class="pro-link">升级 PRO</a>
    </nav>
  </header>

  <main id="main-content">
    <!-- ═══════ Hero ═══════ -->
    <section class="hero" style="text-align:center;padding:3.5rem 1rem 2.5rem;max-width:900px;margin:0 auto;">
      <div class="hero-badge">🌏 全球此刻</div>
      <h1>他们在干嘛，<br>一眼就知道</h1>
      <p class="subtitle">
        旧金山在沉睡、伦敦刚上班、东京正黄昏。<br>
        不需要换算时区，直接感受全球节奏。
      </p>
      
      <!-- 智能搜索 -->
      <div class="smart-search" style="max-width:540px;margin:0 auto 1.8rem;position:relative;display:flex;gap:0.5rem;">
        <input type="text" id="decision-input" 
               placeholder="搜索任何城市… 东京、伦敦、New York、Paris…"
               autocomplete="off"
               style="flex:1;padding:0.95rem 1.2rem;font-size:1rem;border:1.5px solid var(--border);border-radius:var(--radius);outline:none;">
        <button id="decision-btn" aria-label="搜索" style="padding:0 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:0.95rem;font-weight:600;cursor:pointer;white-space:nowrap;">🔍 搜索</button>
      </div>

      <!-- 动态地球 -->
      <div id="earth-visual" style="margin:1rem auto 0;max-width:600px;"></div>

      <!-- 添加城市 -->
      <div style="max-width:540px;margin:1.2rem auto 0;position:relative;display:flex;gap:0.5rem;">
        <div style="flex:1;position:relative;">
          <input type="text" id="city-search-input" placeholder="添加城市到看板…（中英文均可）" autocomplete="off" style="width:100%;padding:0.7rem 1rem;font-size:0.9rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);outline:none;box-sizing:border-box;">
          <div id="city-search-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:100;max-height:220px;overflow-y:auto;margin-top:4px;"></div>
        </div>
        <button id="city-search-btn" aria-label="添加城市" style="padding:0 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.9rem;font-weight:600;cursor:pointer;white-space:nowrap;">+ 添加</button>
      </div>

      <!-- 动态城市卡片 -->
      <div id="custom-city-cards" class="quick-cards" style="display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-top:1.2rem;position:relative;z-index:1;"></div>
    </section>
  </main>

  <aside class="sidebar-ad" aria-label="广告">
    <div class="ad-container" data-ad-slot="【通过广告系统配置】" data-width="300" data-height="250"></div>
  </aside>

  <!-- ═══════ Footer ═══════ -->
  <footer style="text-align:center;padding:2rem 1rem;color:var(--text-secondary);font-size:0.85rem;border-top:1px solid var(--border-subtle);">
    <p style="display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap;">
      <a href="/about/" style="color:var(--text-secondary);text-decoration:none;">关于我们</a>
      <a href="/privacy/" style="color:var(--text-secondary);text-decoration:none;">隐私政策</a>
      <a href="/terms/" style="color:var(--text-secondary);text-decoration:none;">服务条款</a>
      <a href="mailto:support@globetimezone.com" style="color:var(--text-secondary);text-decoration:none;">联系我们</a>
    </p>
    <p style="margin-top:0.5rem;">© 2026 GlobeTimeZone · 所有时间数据基于 NTP 实时校准 · 时区数据来源 IANA</p>
  </footer>

  <!-- ═══════ Scripts ═══════ -->
  <script>
    // 滚动时导航栏加阴影
    (function() {
      var header = document.getElementById('site-header');
      if (!header) return;
      window.addEventListener('scroll', function() {
        if (window.scrollY > 10) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
      }, { passive: true });
    })();

    // 滚动揭示动画
    (function() {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.reveal').forEach(function(el) {
        observer.observe(el);
      });
    })();
  </script>

  <script src="/js/earth-visual.js?v=12" defer></script>
  <script src="/js/custom-cities.js?v=10" defer></script>
  <script src="/js/meeting-planner.js?v=3" defer></script>
  <script type="module" src="/scripts/app.js" defer></script>
  <script type="module" defer>
    import { initSentry } from '/scripts/sentry-init.js';
    initSentry();
  </script>
  <script src="/js/trust-dashboard.js" defer></script>
  <script src="/cookie-consent.js" defer></script>
  <script src="/ads-loader.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
  <script src="/baidu-analytics.js" defer></script>
</body>
</html>
