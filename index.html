<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTimeZone</title>
  <meta data-i18n-attr="content:meta.description" name="description" content="一眼判断该不该联系、何时开会。实时感知全球节奏。">
  <!-- 浏览器语言自动检测（根路径引导，同步加载） -->
  <script src="/js/auto-lang.js?v=5" data-cfasync="false"></script>

  <!-- i18n 多语言引擎（异步，不阻塞渲染） -->
  <script src="/js/i18n.js?v=5" defer data-cfasync="false"></script>

  <!-- Hreflang 多语言 SEO -->
  <link rel="alternate" hreflang="en" href="https://globetimezone.com/en/" />
  <link rel="alternate" hreflang="zh-CN" href="https://globetimezone.com/zh/" />
  <link rel="alternate" hreflang="de" href="https://globetimezone.com/de/" />
  <link rel="alternate" hreflang="fr" href="https://globetimezone.com/fr/" />
  <link rel="alternate" hreflang="es" href="https://globetimezone.com/es/" />
  <link rel="alternate" hreflang="ja" href="https://globetimezone.com/ja/" />
  <link rel="alternate" hreflang="ko" href="https://globetimezone.com/ko/" />
  <link rel="alternate" hreflang="pt-BR" href="https://globetimezone.com/pt/" />
  <link rel="alternate" hreflang="ar" href="https://globetimezone.com/ar/" />
  <link rel="alternate" hreflang="x-default" href="https://globetimezone.com/" />
  <meta name="baidu-tongji-id" content="cb6f0f9eec485c2521ce68dab67f5515" />
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://pagead2.googlesyndication.com">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles/premium.css?v=2">
  <style nonce="{{nonce}}">
    real-clock, smart-clock {
      display: inline-block; min-width: 60px; visibility: hidden;
    }
    real-clock:defined, smart-clock:defined { visibility: visible; }
    .ad-container { width: 300px; height: 250px; background: #f8fafc; contain: layout style; }
    .skip-link { position: absolute; top: -100px; left: 0; }
    /* 语言切换器 */
    .lang-picker #lang-drop.show { display: block !important; }
    .lang-picker #lang-drop a:hover { background: var(--bg-secondary, #f0f4f8); }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="nav.skipToContent">跳到主内容</a>
  
  <header id="site-header">
    <nav aria-label="主导航" data-i18n-attr="aria-label:nav.ariaLabel" style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;max-width:1200px;margin:0 auto;padding:0.75rem 1.5rem;">
      <a href="/" style="font-weight:800;font-size:1.05rem;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:0.4rem;">
        <span style="font-size:1.3rem;">🌍</span>GlobeTimeZone
      </a>
      <a href="/time-difference/" style="text-decoration:none;color:var(--text);" data-i18n="nav.timezones">时差查询</a>
      <a href="/meeting-planner/" style="text-decoration:none;color:var(--text);" data-i18n="nav.meeting">会议规划</a>
      <a href="/tools/cross-border/" style="text-decoration:none;color:var(--text);" data-i18n="nav.crossborder">跨境工具</a>
      <a href="/blog/" style="text-decoration:none;color:var(--text);" data-i18n="nav.guides">教程</a>
      <a href="/pricing/" class="pro-link" data-i18n="nav.upgrade">升级 PRO</a>

      <!-- 语言切换器 -->
      <div style="margin-left:auto;position:relative;" class="lang-picker">
        <button id="lang-btn" aria-label="切换语言" data-i18n-attr="aria-label:nav.langButtonAriaLabel" aria-expanded="false"
          style="background:none;border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.6rem;font-size:0.78rem;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;gap:0.25rem;white-space:nowrap;"
          onclick="var d=document.getElementById('lang-drop');var s=d.classList.contains('show');d.classList.toggle('show');this.setAttribute('aria-expanded',s?'false':'true')">
          <span data-i18n="nav.langButton">🌐 中文 ▾</span>
        </button>
        <div id="lang-drop"
          style="display:none;position:absolute;right:0;top:100%;margin-top:6px;background:var(--bg,#fff);border:1px solid var(--border);border-radius:8px;min-width:148px;box-shadow:0 6px 20px rgba(0,0,0,0.12);z-index:1000;"
          onclick="event.stopPropagation()">
          <a href="/zh/" data-lang="zh" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;border-radius:4px 4px 0 0;">🇨🇳 中文</a>
          <a href="/en/" data-lang="en" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇺🇸 English</a>
          <a href="/de/" data-lang="de" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇩🇪 Deutsch</a>
          <a href="/fr/" data-lang="fr" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇫🇷 Français</a>
          <a href="/es/" data-lang="es" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇪🇸 Español</a>
          <a href="/ja/" data-lang="ja" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇯🇵 日本語</a>
          <a href="/ko/" data-lang="ko" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇰🇷 한국어</a>
          <a href="/pt/" data-lang="pt" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;">🇧🇷 Português</a>
          <a href="/ar/" data-lang="ar" style="display:block;padding:0.45rem 0.85rem;text-decoration:none;color:var(--text);font-size:0.8rem;border-radius:0 0 4px 4px;">🇸🇦 العربية</a>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <!-- ═══════ Hero ═══════ -->
    <section class="hero" style="text-align:center;padding:3.5rem 1rem 2.5rem;max-width:900px;margin:0 auto;">
      <div class="hero-badge" data-i18n="hero.badge">🌏 全球此刻</div>
      <h1 data-i18n-html="hero.title">他们在干嘛，<br>一眼就知道</h1>
      <p class="subtitle" data-i18n-html="hero.subtitle">
        旧金山在沉睡、伦敦刚上班、东京正黄昏。<br>
        不需要换算时区，直接感受全球节奏。
      </p>
      
      <!-- 智能搜索 -->
      <div class="smart-search" style="max-width:540px;margin:0 auto 1.8rem;position:relative;display:flex;gap:0.5rem;">
        <input type="text" id="decision-input" 
               data-i18n-attr="placeholder:hero.search.placeholder"
               placeholder="搜索任何城市… 东京、伦敦、New York、Paris…"
               autocomplete="off"
               style="flex:1;padding:0.95rem 1.2rem;font-size:1rem;border:1.5px solid var(--border);border-radius:var(--radius);outline:none;">
        <button id="decision-btn" data-i18n-attr="aria-label:hero.search.button" aria-label="搜索" style="padding:0 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:0.95rem;font-weight:600;cursor:pointer;white-space:nowrap;" data-i18n="hero.search.button">🔍 搜索</button>
      </div>

      <!-- 动态地球 -->
      <div id="earth-visual" style="margin:1rem auto 0;max-width:600px;"></div>

      <!-- 添加城市 -->
      <div style="max-width:540px;margin:1.2rem auto 0;position:relative;display:flex;gap:0.5rem;">
        <div style="flex:1;position:relative;">
          <input type="text" id="city-search-input" data-i18n-attr="placeholder:hero.city.placeholder" placeholder="添加城市到看板…（中英文均可）" autocomplete="off" style="width:100%;padding:0.7rem 1rem;font-size:0.9rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);outline:none;box-sizing:border-box;">
          <div id="city-search-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:100;max-height:220px;overflow-y:auto;margin-top:4px;"></div>
        </div>
        <button id="city-search-btn" data-i18n-attr="aria-label:hero.city.button" aria-label="添加城市" style="padding:0 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.9rem;font-weight:600;cursor:pointer;white-space:nowrap;" data-i18n="hero.city.button">+ 添加</button>
      </div>

      <!-- 动态城市卡片 -->
      <div id="custom-city-cards" class="quick-cards" style="display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-top:1.2rem;position:relative;z-index:1;"></div>
    </section>
  </main>

  <aside class="sidebar-ad" aria-label="广告" data-i18n-attr="aria-label:sidebar.ad.label">
    <div class="ad-container" data-ad-slot="【通过广告系统配置】" data-width="300" data-height="250"></div>
  </aside>

  <!-- ═══════ Footer ═══════ -->
  <footer style="text-align:center;padding:2rem 1rem;color:var(--text-secondary);font-size:0.85rem;border-top:1px solid var(--border-subtle);">
    <p style="display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap;">
      <a href="/about/" style="color:var(--text-secondary);text-decoration:none;" data-i18n="footer.about">关于我们</a>
      <a href="/privacy/" style="color:var(--text-secondary);text-decoration:none;" data-i18n="footer.privacy">隐私政策</a>
      <a href="/terms/" style="color:var(--text-secondary);text-decoration:none;" data-i18n="footer.terms">服务条款</a>
      <a href="mailto:support@globetimezone.com" style="color:var(--text-secondary);text-decoration:none;" data-i18n="footer.contact">联系我们</a>
    </p>
    <p style="margin-top:0.5rem;" data-i18n="footer.copyright">© 2026 GlobeTimeZone · 所有时间数据基于 NTP 实时校准 · 时区数据来源 IANA</p>
  </footer>

  <!-- ═══════ Scripts ═══════ -->
  <script>
    // 滚动时导航栏加阴影
    (function() {
      var header = document.getElementById('site-header');
      if (!header) return;
      window.addEventListener('scroll', function() {
        if (window.scrollY > 10) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
      }, { passive: true });
    })();

    // 语言切换器：点击外部关闭下拉
    document.addEventListener('click', function(e) {
      var drop = document.getElementById('lang-drop');
      var btn = document.getElementById('lang-btn');
      if (drop && btn && !btn.contains(e.target) && !drop.contains(e.target)) {
        drop.classList.remove('show');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    // 滚动揭示动画
    (function() {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.reveal').forEach(function(el) {
        observer.observe(el);
      });
    })();
  </script>

  <script src="/js/earth-visual.js?v=20260611" defer data-cfasync="false"></script>
  <script src="/js/custom-cities.js?v=12" defer data-cfasync="false"></script>
  <script src="/js/meeting-planner.js?v=3" defer data-cfasync="false"></script>
  <script type="module" src="/scripts/app.js" defer></script>
  <script type="module" defer>
    import { initSentry } from '/scripts/sentry-init.js';
    initSentry();
  </script>
  <script src="/js/trust-dashboard.js" defer data-cfasync="false"></script>
  <script src="/cookie-consent.js" defer data-cfasync="false"></script>
  <script src="/ads-loader.js" defer data-cfasync="false"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
  <script src="/baidu-analytics.js" defer data-cfasync="false"></script>
</body>
</html>
