const MONTHS_ZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

let currentCountry = 'US';
let currentFilter = 'all';

function selectCountry(code, flag, name) {
  currentCountry = code;
  document.querySelectorAll('.country-btn').forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('selected-country-name').textContent = flag + ' ' + name + ' ' + new Date().getFullYear() + '年节假日';
  loadHolidays();
  updateUpcoming();
}

function loadHolidays() {
  const year = document.getElementById('year-select').value;
  const holidays = HOLIDAYS_DATA[currentCountry] || [];
  let filtered = holidays.filter(h => h.date.startsWith(year));
  if (currentFilter !== 'all') { filtered = filtered.filter(h => h.type === currentFilter); }
  filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
  
  const byMonth = {};
  filtered.forEach(h => {
    const monthIdx = new Date(h.date).getMonth();
    const month = MONTHS_ZH[monthIdx];
    if (!byMonth[month]) byMonth[month] = [];
    byMonth[month].push(h);
  });
  
  const container = document.getElementById('holidays-list');
  container.innerHTML = Object.entries(byMonth).map(([month, holidays]) => `
    <div class="month-section">
      <div class="month-header">
        <span>📅 ${month}</span>
        <span style="font-size:0.85rem;font-weight:400;">${holidays.length} 个节假日</span>
      </div>
      ${holidays.map(h => renderHolidayItem(h)).join('')}
    </div>
  `).join('');
}

function renderHolidayItem(holiday) {
  const date = new Date(holiday.date + 'T00:00:00');
  const day = date.getDate();
  const month = date.toLocaleDateString('zh-CN', { month: 'short' });
  const daysUntil = Math.ceil((date - new Date()) / (1000 * 60 * 60 * 24));
  
  let daysText = '';
  let daysClass = '';
  
  if (daysUntil > 0 && daysUntil <= 30) {
    daysText = '还有' + daysUntil + ' 天';
    daysClass = daysUntil <= 7 ? 'soon' : '';
  } else if (daysUntil === 0) {
    daysText = '就在今天！';
    daysClass = 'soon';
  } else if (daysUntil < 0) {
    daysText = '已过';
    daysClass = '';
  } else {
    daysText = '还有' + daysUntil + ' 天';
    daysClass = '';
  }

  const typeLabels = { national: '国家法定假日', observance: '纪念日/节日', bank: '银行假日', federal: '联邦假日' };
  const typeLabel = typeLabels[holiday.type] || holiday.type;
  
  return `
    <div class="holiday-item">
      <div class="holiday-date">
        <span class="holiday-day">${day}</span>
        <span class="holiday-month">${month}</span>
      </div>
      <div class="holiday-info">
        <div class="holiday-name">${holiday.name}</div>
        <span class="holiday-type ${holiday.type}">${typeLabel}</span>
      </div>
      <span class="days-until ${daysClass}">${daysText}</span>
    </div>
  `;
}

function filterHolidays(type) {
  currentFilter = type;
  document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
  event.currentTarget.classList.add('active');
  loadHolidays();
}

function updateUpcoming() {
  const holidays = HOLIDAYS_DATA[currentCountry] || [];
  const today = new Date();
  const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
  
  const upcoming = holidays
    .filter(h => { const date = new Date(h.date + 'T00:00:00'); return date >= today && date <= thirtyDaysLater; })
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 5);
  
  const container = document.getElementById('upcoming-list');
  
  if (upcoming.length === 0) {
    container.innerHTML = '<p style="color:#92400e;">未来30天内没有即将到来的假期。</p>';
    return;
  }
  
  container.innerHTML = upcoming.map(h => {
    const date = new Date(h.date + 'T00:00:00');
    const daysUntil = Math.ceil((date - today) / (1000 * 60 * 60 * 24));
    return `
      <div class="upcoming-item">
        <span style="font-weight:600;">${h.name}</span>
        <span style="color:#92400e;">${date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' })}</span>
        <span style="font-size:0.85rem;color:#92400e;">${daysUntil} 天后</span>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  loadHolidays();
  updateUpcoming();
});
