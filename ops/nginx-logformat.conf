# Nginx 访问日志 JSON 格式配置
# 文件路径: /etc/nginx/conf.d/globetimezone-log.conf
# 用途: 结构化日志输出，便于 Logpush / ELK 解析

# ==================== JSON 日志格式 ====================
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"ssl_protocol":"$ssl_protocol",'
    '"request_method":"$request_method",'
    '"scheme":"$scheme"'
  '}';

# ==================== 应用日志格式 ====================
access_log /var/log/nginx/globetimezone.access.log json_combined buffer=64k flush=5s;
error_log  /var/log/nginx/globetimezone.error.log warn;

# ==================== 日志轮转配置 ====================
# 文件路径: /etc/logrotate.d/nginx-globetimezone
# 每日轮转，保留 30 天，压缩旧日志
# /var/log/nginx/globetimezone.access.log
# /var/log/nginx/globetimezone.error.log {
#     daily
#     rotate 30
#     missingok
#     notifempty
#     compress
#     delaycompress
#     sharedscripts
#     postrotate
#         [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
#     endscript
# }

